<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Blue rounded rectangle background -->
  <rect width="200" height="200" rx="44" ry="44" fill="#3B82F6"/>
  <!-- Distance-3 rotated surface code: data qubits at the 3x3 grid vertices (44, 100, 156) -->
  <g stroke="#1E3A8A" stroke-width="3" stroke-linejoin="round">
    <!-- X stabilizers (white): two bulk plaquettes + weight-2 boundaries on top/bottom -->
    <g fill="#FFFFFF">
      <rect x="44" y="44" width="56" height="56"/>
      <rect x="100" y="100" width="56" height="56"/>
      <path d="M100 44 A28 28 0 0 1 156 44 Z"/>
      <path d="M100 156 A28 28 0 0 1 44 156 Z"/>
    </g>
    <!-- Z stabilizers (navy): two bulk plaquettes + weight-2 boundaries on left/right -->
    <g fill="#1E3A8A">
      <rect x="100" y="44" width="56" height="56"/>
      <rect x="44" y="100" width="56" height="56"/>
      <path d="M44 100 A28 28 0 0 1 44 44 Z"/>
      <path d="M156 100 A28 28 0 0 1 156 156 Z"/>
    </g>
  </g>
  <!-- Data qubits -->
  <g fill="#FACC15" stroke="#1E3A8A" stroke-width="3">
    <circle cx="44" cy="44" r="9"/>
    <circle cx="100" cy="44" r="9"/>
    <circle cx="156" cy="44" r="9"/>
    <circle cx="44" cy="100" r="9"/>
    <circle cx="100" cy="100" r="9"/>
    <circle cx="156" cy="100" r="9"/>
    <circle cx="44" cy="156" r="9"/>
    <circle cx="100" cy="156" r="9"/>
    <circle cx="156" cy="156" r="9"/>
  </g>
</svg>
