# Publica el sitio en GitHub Pages.
# Solo funciona cuando esta carpeta es la raíz de su propio repositorio.
# Se ejecuta a mano (pestaña Actions → «Publicar en GitHub Pages» → Run workflow).
# Para publicar en cada cambio, descomenta el bloque `push`.

name: Publicar en GitHub Pages

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Compilar y comprobar
        run: node scripts/build.mjs && node scripts/check.mjs
        env:
          RUTA_BASE: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
